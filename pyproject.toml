[project]
name = "angio-annotator"
version = "0.1.0"
description = "Desktop image annotation tool for angiogram segmentation"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PySide6>=6.6,<6.8",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "Pillow>=10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
